<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заявки на доставку</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            font-size: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        button {
            width: 100%;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>📦 Заявка на доставку</h2>

    <form id="orderForm">
        <!-- Текстовое поле для населенного пункта -->
        <div class="form-group">
            <label for="destination">📍 Населенный пункт назначения:</label>
            <input type="text" id="destination" placeholder="Например: Анадырь, Лаврентия, Певек" required>
        </div>

        <!-- Выбор службы / маркетплейса -->
        <div class="form-group">
            <label for="service">🚚 Служба / Маркетплейс:</label>
            <select id="service" required>
                <option value="" disabled selected>Выберите сервис</option>
                <option value="Авито">Авито (Любой НП)</option>
                <option value="Wildberries">Wildberries (Анадырь)</option>
                <option value="Ozon">Ozon (Анадырь, Угольные Копи, Певек)</option>
                <option value="Почта России">Почта России (Любой НП)</option>
                <option value="СДЭК / Яндекс Маркет">СДЭК / Яндекс Маркет</option>
                <option value="Другое">Другое</option>
            </select>
        </div>

        <!-- Количество товаров в штуках -->
        <div class="form-group">
            <label for="itemCount">🔢 Количество товаров (в шт.):</label>
            <input type="number" id="itemCount" min="1" placeholder="Например: 1" required>
        </div>

        <!-- Трек-номер / ссылка -->
        <div class="form-group">
            <label for="trackInfo">🔗 Трек-номер / Ссылка / Код (необязательно):</label>
            <input type="text" id="trackInfo" placeholder="Номер заказа или трек-код">
        </div>

        <hr style="border: 0; border-top: 1px solid #ccc; margin: 16px 0;">

        <!-- Отправитель -->
        <div class="form-group">
            <label for="senderContact">📞 Телефон отправителя:</label>
            <input type="tel" id="senderContact" placeholder="+7 999 000-00-00" required>
        </div>

        <!-- Получатель -->
        <div class="form-group">
            <label for="recipientInfo">🎯 ФИО и телефон ПОЛУЧАТЕЛЯ:</label>
            <textarea id="recipientInfo" rows="2" placeholder="Иванов Иван Иванович, +7 999 123-45-67" required></textarea>
        </div>

        <button type="submit" id="submitBtn">Отправить заявку</button>
    </form>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const form = document.getElementById('orderForm');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const countVal = document.getElementById('itemCount').value;

            const data = {
                destination: document.getElementById('destination').value,
                service: document.getElementById('service').value,
                itemCount: countVal + " шт.",
                trackInfo: document.getElementById('trackInfo').value || "Не указано",
                senderContact: document.getElementById('senderContact').value,
                recipientInfo: document.getElementById('recipientInfo').value
            };

            tg.sendData(JSON.stringify(data));
        });
    </script>
</body>
</html>
